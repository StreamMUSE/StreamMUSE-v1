project: &project "Real-Time Accompaniment Generation "
description: | 
  "symbolic music generation with XinYue's tokenization and customed RoFormer, 
  trained on aria dataset(skyline_top2) without mask. The model size is around 0.12 B"

name: &name "old_m2a_nomask_aria"
version: &version "1.4"
save_dir: &save_dir "logs/"
loggers:
  csv_logger:
    type: "csv"
  tensorboard_logger:
    type: "tensorboard"
  # - wandb_logger:
  #   type: "wandb"
  #   project: *project_name
  #   entity: "music_generation"
  #   name: "REMI_RoFormer_pop909"
  #   version: "1.0.0"

dataset:
  tokenizer: "XinYue's"
  train_config:
    batch_size: 16
    num_workers: 0
    file_path: "data/data_aria_skyline_top2/top2_acc_cp10.pt" # path to the preprocessed training data
    target_length: 384
    tokenization_type: "XinYue's"
    split_ratio: 10
  val_config:
    batch_size: 16
    num_workers: 0
    file_path: "data/data_aria_skyline_top2/top2_acc_cp10.pt"
    target_length: 384
    tokenization_type: "XinYue's"
    split_ratio: 10

model:
  model_name: "XinYue's + nomask + customed RoFormer"
  model_type: "Old-M2A-Transformer-Nomask"
  large: true
  
trainer:
  max_epochs: 5000
  accelerator: "gpu"
  devices: [ 2 ]
seed: 42
