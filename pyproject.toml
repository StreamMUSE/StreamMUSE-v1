[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"streammuse.presentation.task_web" = [
  "static/index.html",
  "static/css/*.css",
  "static/js/*.js",
]

[project]
name = "streammuse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "deepspeed>=0.17.1",
  "fastapi>=0.116.1",
  "ipykernel>=6.29.5",
  "joblib>=1.5.1",
  "lightning>=2.5.2",
  "matplotlib>=3.10.3",
  "miditok>=3.0.5.post1",
  "mido>=1.3.3",
  "mir-eval>=0.8.2",
  "music21>=9.7.1",
  "nvitop>=1.5.1",
  "pretty-midi>=0.2.10",
  "pydantic>=2.11.7",
  "pynput>=1.8.1",
  "pytest>=8.4.1",
  "python-rtmidi>=1.5.8",
  "pytorch-lightning>=2.5.1.post0",
  "requests>=2.32.0",
  "scipy>=1.15.3",
  "tensorboard>=2.19.0",
  "tensorboardx>=2.6.4",
  "tensorflow>=2.19.0",
  "tokenizers>=0.21.1",
  "torch>=2.5.0",
  "torch-tb-profiler>=0.4.3",
  "torchvision>=0.22.0",
  "transformers",
  "uvicorn>=0.35.0",
  "wandb>=0.20.1",
  "websockets>=12",
  "httpx>=0.27",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.2,<1.3",
  "onnxruntime<1.24; python_version < '3.11'",
  "sounddevice>=0.5,<0.6",
  "webrtcvad-wheels>=2.0,<2.1",
]
speech = [
  "sounddevice>=0.5,<0.6",
]
tts-kokoro = [
  "kokoro>=0.9,<1.0",
  "soundfile>=0.12",
  "sounddevice>=0.5,<0.6",
]

[project.scripts]
streammuse-cli = "streammuse.presentation.cli.cli:main"
streammuse-web = "streammuse.presentation.web.server:main"
streammuse-debug = "streammuse.presentation.debug.cli:main"
streammuse-task = "streammuse.presentation.task.cli:main"

[tool.pytest.ini_options]
markers = [
  "consistency: realtime/offline end-to-end consistency test (needs GPU + checkpoint; opt-in via checkpoint env)",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
transformers = { path = "transformers", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
