[project]
name = "streammuse-rap-vllm-metal"
version = "0.1.0"
description = "Isolated uv environment for the Mac-local Qwen server (vLLM + vllm-metal MLX backend)"
requires-python = "==3.12.*"
dependencies = [
  # The pair vllm-metal's own install.sh installs with `uv pip install`:
  # vllm-metal v0.30.0 declares vLLM v0.30.0 in .github/vllm-release-tag.commit.
  "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.30.0/vllm-0.30.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl",
  "vllm-metal @ https://github.com/vllm-project/vllm-metal/releases/download/v0.30.0/vllm_metal-0.30.0-cp312-cp312-macosx_15_0_arm64.whl",
]

[tool.uv]
package = false
# vllm-metal only ships macOS arm64 wheels; resolve for Apple Silicon only.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
