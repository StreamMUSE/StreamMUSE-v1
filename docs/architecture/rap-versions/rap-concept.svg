  <text x="895.0" y="316.0" class="box-title" text-anchor="middle">TTS 模型</text>
  <text x="895.0" y="342.0" class="box-sub" text-anchor="middle">MOSS · 每次合成 1 个 bar</text>
  <text x="895.0" y="362.0" class="box-sub" text-anchor="middle">对齐每个音节的起点</text>
  <text x="895.0" y="384.0" class="small" text-anchor="middle" style="fill:#7448D1;font-weight:600">一直合成到播放头前 2 个 bar</text>
