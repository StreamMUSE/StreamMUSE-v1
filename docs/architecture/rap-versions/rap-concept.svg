  <text x="96.0" y="686.0" class="box-title">听众 / Web 控制</text>
  <text x="96.0" y="708.0" class="box-sub">选择 theme 和 flow template</text>
  <text x="96.0" y="726.0" class="box-sub">播放中随时修改</text>
  <rect x="430.0" y="660.0" width="250.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#2F6BDB" stroke-width="1.0" filter="url(#shadow)"/>
  <text x="446.0" y="686.0" class="box-title">收到的歌词</text>
  <text x="446.0" y="708.0" class="box-sub">知道下一个 bar 唱什么</text>
  <text x="446.0" y="726.0" class="box-sub">以及它的 lyric_id</text>
  <rect x="760.0" y="660.0" width="270.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#2F6BDB" stroke-width="1.0" filter="url(#shadow)"/>
  <text x="776.0" y="686.0" class="box-title">逐 bar 控制器</text>
  <text x="776.0" y="708.0" class="box-sub">按节拍时钟决定</text>
  <text x="776.0" y="726.0" class="box-sub">该取哪个 bar 的音频</text>
  <rect x="1110.0" y="660.0" width="270.0" height="100.0" rx="10" fill="#2F6BDB" stroke="#2F6BDB" stroke-width="1.0" filter="url(#shadow)"/>
