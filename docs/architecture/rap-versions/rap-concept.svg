  <text x="1126.0" y="708.0" class="box-sub" style="fill:#DCE7FF">没拿到音频就用 eSpeak 兜底</text>
  <text x="1126.0" y="726.0" class="box-sub" style="fill:#DCE7FF">节奏永不中断</text>
