    .change { font-size: 14px; fill: #7A3A0C; }
    .pill { font-size: 13px; font-weight: 700; }
</style><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7180"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6BDB"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7448D1"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9B5F"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D08A00"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9B3C6"/></marker><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1F2430" flood-opacity="0.10"/></filter></defs>
  <rect width="1440" height="900" fill="#FFFFFF"/>
  <text x="40.0" y="52.0" class="title">StreamMUSE 实时 Rap：歌词流架构（概念图）</text>
  <text x="40.0" y="82.0" class="subtitle">服务器一直往前写歌词、往前合成音频，结果分别存进 Lyric Pool 和 Audio Bank；客户端只发主题和 flow，并按需取回音频。对应 v1.0 / v1.1（协议 v3）。</text>
  <rect x="40.0" y="104.0" width="1360.0" height="436.0" rx="16" fill="#F6F2FF" stroke="#7448D1" stroke-width="1.5"/>
  <rect x="64.0" y="122.0" width="76.0" height="22.0" rx="11" fill="#7448D1"/>
  <text x="102.0" y="138.0" class="panel-tag" text-anchor="middle">SERVER</text>
  <text x="152.0" y="140.0" class="panel-title">H200：持续写词 → 持续合成</text>
  <rect x="80.0" y="280.0" width="270.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#2F6BDB" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="215.0" y="316.0" class="box-title" text-anchor="middle">写词模型 Lyric Writer</text>
  <text x="215.0" y="342.0" class="box-sub" text-anchor="middle">LLM · 每 bar 生成多条候选</text>
  <text x="215.0" y="362.0" class="box-sub" text-anchor="middle">过滤 + 打分 → 选出一句</text>
  <text x="215.0" y="384.0" class="small" text-anchor="middle" style="fill:#2F6BDB;font-weight:600">一直写到播放头前 3 个 bar</text>
  <path d="M320,280 C320,202 110,202 110,276" fill="none" stroke="#2F6BDB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="215.0" y="172.0" class="label" text-anchor="middle" style="fill:#2F6BDB">自回归：一句接一句往下写</text>
  <text x="215.0" y="190.0" class="small" text-anchor="middle">上一句（和押韵）作为下一句的上下文</text>
  <rect x="430.0" y="262.0" width="250.0" height="156.0" rx="10" fill="#EEF4FF" stroke="#2F6BDB" stroke-width="1.8" filter="url(#shadow)"/>
