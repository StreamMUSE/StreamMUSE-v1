  <text x="1109.0" y="598.0" class="small" text-anchor="middle">bar + lyric_id</text>
  <text x="1109.0" y="614.0" class="small" text-anchor="middle">（client 发请求时）</text>
  <rect x="1316.0" y="564.0" width="72.0" height="52.0" rx="8" fill="#FFFFFF" stroke="#7448D1" stroke-width="1.0"/>
  <text x="1352.0" y="586.0" class="label" text-anchor="middle" style="fill:#7448D1">音频</text>
  <text x="1352.0" y="605.0" class="small" text-anchor="middle">才发回</text>
  <text x="40.0" y="868.0" class="small">两个模型各自不停地往前生成，彼此只通过 Lyric Pool 衔接；客户端不等任何一次生成，只在需要某个 bar 时取回已经准备好的音频。</text>
