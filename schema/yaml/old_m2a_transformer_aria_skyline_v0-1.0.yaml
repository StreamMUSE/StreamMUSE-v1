project: &project "Real-Time Accompaniment Generation "
description: "symbolic music generation with XinYue's tokenization and customed RoFormer, trained on pop 909 dataset"

name: &name "old_m2a_aria"
version: &version "1.0"

loggers:
  csv_logger:
    type: "csv"
    save_dir: "logs/"
    name: *name
    version: *version
  tensorboard_logger:
    type: "tensorboard"
    save_dir: "logs/"
    name: *name
    version: *version
  # - wandb_logger:
  #   type: "wandb"
  #   project: *project_name
  #   entity: "music_generation"
  #   name: "REMI_RoFormer_pop909"
  #   version: "1.0.0"

dataset:
  tokenizer: "XinYue's"
  train_config:
    batch_size: 8
    num_workers: 0
    file_path: "data_aria_skyline_v0/aria_skyline_v0_acc_cp10.pt" # path to the preprocessed training data
    target_length: 384
    tokenization_type: "XinYue's"
    split_ratio: 10
  val_config:
    batch_size: 8
    num_workers: 0
    file_path: "data_aria_skyline_v0/aria_skyline_v0_acc_cp10.pt"
    target_length: 384
    tokenization_type: "XinYue's"
    split_ratio: 10

model:
  model_name: "XinYue's + customed RoFormer"
  model_type: "Old-M2A-Transformer"
  hidden_size: 1536  # Hidden layer dimension of the global model. Overrides 'large' setting if specified.
  num_layers: 12  # Number of Transformer encoder layers in the global model. Overrides 'large' setting if specified.
  num_attention_heads: 16  # Number of attention heads in the global model. Overrides 'large' setting if specified.
  intermediate_size: 6144  # Intermediate size of the feed-forward network in the global model. Overrides 'large' setting if specified.

  # Local Model (Encoder/Decoder) Hyperparameters
  local_model_num_layers: 3  # Number of layers in the local encoder/decoder.
  local_model_num_attention_heads: 16  # Number of attention heads in the local encoder/decoder.
  local_model_intermediate_size: 3072  # Intermediate size of the feed-forward network in the local encoder/decoder.
  
trainer:
  max_epochs: 5000
  accelerator: "gpu"
  devices: [ 0, 1, 2, 3, 4 ]
seed: 42
