project: &project "Real-Time Accompaniment Generation "
description: |
  "symbolic music generation with XinYue's tokenization and New interleaved RoFormer, 
  continue trained on 1.0.13 with pop909 . 
  "

name: &name "new_pop909"
version: &version "1.0"
save_dir: &save_dir "logs/"
loggers:
  csv_logger:
    type: "csv"
  tensorboard_logger:
    type: "tensorboard"
  # - wandb_logger:
  #   type: "wandb"
  #   project: *project_name
  #   entity: "music_generation"
  #   name: "REMI_RoFormer_pop909"
  #   version: "1.0.0"

dataset:
  tokenizer: "New XinYue's"
  train_config:
    batch_size: 4
    num_workers: 0
    file_path: "data/pop909_acc_cp4.pt" # path to the preprocessed training data
    target_length: 384
    tokenization_type: "XinYue's"
    split_ratio: 10
    sequence_shift: 32
  val_config:
    batch_size: 4
    num_workers: 0
    file_path: "data/pop909_acc_cp4.pt"
    target_length: 384
    tokenization_type: "XinYue's"
    split_ratio: 10
    sequence_shift: 32


model:
  model_name: "XinYue's + customed RoFormer"
  model_type: "New-M2A-Transformer"
  hidden_size: 1024  # Hidden layer dimension of the global model. Overrides 'large' setting if specified.
  num_layers: 12  # Number of Transformer encoder layers in the global model. Overrides 'large' setting if specified.
  num_attention_heads: 8  # Number of attention heads in the global model. Overrides 'large' setting if specified.
  intermediate_size: 3072  # Intermediate size of the feed-forward network in the global model. Overrides 'large' setting if specified.

  # Local Model (Encoder/Decoder) Hyperparameters
  local_model_num_layers: 6  # Number of layers in the local encoder/decoder.
  local_model_num_attention_heads: 8  # Number of attention heads in the local encoder/decoder.
  local_model_intermediate_size: 3072  # Intermediate size of the feed-forward network in the local encoder/decoder.
  # ckpt_path: "/opt/dlami/nvme/stanley/StreamMUSE/logs/old_m2a_aria/1.0.13/ckpt/epoch=00-val_loss=1.19.ckpt" # Path to the checkpoint file for resuming training or inference
  
trainer:
  max_epochs: 100
  accelerator: "gpu"
  devices: [  1,2,3,4,5,6,7 ]
seed: 42
