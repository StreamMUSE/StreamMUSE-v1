# StreamMUSE Bulk Benchmark Configuration
# This file defines experiments to run with different parameter combinations

experiment:
  name: "generation_length_prompt_length_study"
  description: "Grid search over generation length and prompt length parameters"
  output_dir: "experiments/generation_length_prompt_length_study"
  
# Server configuration
server:
  url: "http://localhost:8000/generate_accompaniment"
  # Optional: commands to start/stop server automatically
  # start_command: "uvicorn app.server:app --host 0.0.0.0 --port 8000"
  # stop_command: null  # Will use Ctrl+C
  # wait_for_startup: 10  # seconds to wait after starting server

# Base benchmark configuration
benchmark:
  num_requests: 100
  tempo: 120.0
  assumed_network_latency_ms: null
  inference_interval_ticks: null

# Grid search parameters - each parameter can be a single value or list of values
parameters:
  generation_length_frames: [1, 3, 5, 7, 9, 11, 13, 15]
  prompt_length_ticks: [48, 96, 144, 192]  # Different context lengths to test

# Injection configuration - inject musical prompt matching the prompt_length_ticks parameter
injection:
  enabled: true
  file_path: "path/to/prompt.mid"  # Path to MIDI file containing musical prompt
  # injection_length_ticks will be automatically set to match prompt_length_ticks parameter
  
# Optional: Additional experiments with different parameter sets
additional_experiments:
  - name: "prompt_length_sensitivity"
    description: "Test prompt length sensitivity with fixed generation length"
    parameters:
      generation_length_frames: [5]  # Fixed at 5 frames
      prompt_length_ticks: [24, 48, 72, 96, 120, 144, 168, 192, 216, 240]
  
  - name: "tempo_analysis"
    description: "Test different tempos with optimal parameters"
    parameters:
      generation_length_frames: [5]
      prompt_length_ticks: [96]
      tempo: [60, 80, 100, 120, 140, 160, 180]

# Execution options
execution:
  parallel: false  # Run experiments in parallel (not recommended for single server)
  max_workers: 1   # Number of parallel workers if parallel is true
  retry_failed: true  # Retry failed experiments
  max_retries: 2
  delay_between_experiments: 5.0  # Seconds to wait between experiments
  clear_server_history: true  # Clear server history between experiments

# Analysis options
analysis:
  generate_plots: true
  generate_summary: true
  export_combined_csv: true
  calculate_percentiles: [50, 70, 80, 90, 95, 99]