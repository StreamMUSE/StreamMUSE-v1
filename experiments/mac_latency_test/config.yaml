# Quick Test Configuration for StreamMUSE Bulk Benchmark
# A minimal configuration for testing the bulk benchmark system

experiment:
  name: "mac_latency_test"
  description: "Quick test of latency differences on mac"
  output_dir: "experiments/mac_latency_test"

server:
  url: "http://localhost:8001/generate_accompaniment"

benchmark:
  num_requests: 200
  tempo: 120.0

parameters:
  generation_length_frames: [1, 5, 9, 15]
  prompt_length_ticks: [384]

# Injection configuration (optional)
injection:
  enabled: True
  file_path: "input/mel/001.mid"

execution:
  parallel: false
  retry_failed: false
  max_retries: 1
  delay_between_experiments: 2.0
  clear_server_history: true

analysis:
  generate_plots: false  # Disable plotting for quick test
  generate_summary: true
  export_combined_csv: true
  calculate_percentiles: []