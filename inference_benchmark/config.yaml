# Inference Benchmark Configuration File
# This file defines the datasets and scripts to be used in the next inference benchmark.

benchmark_name: "test1"

# Inference Parameters
inference_params:
  prompt_length: 200
  n_samples: 1
  generate_length: 200
  temperature: 1.0

# All datasets available for benchmarking
datasets_all:
  - aria_unique_skyline_top2
  - pop909_dataset

# Datasets to be included in the next benchmark run
datasets_to_run:
  - aria_unique_skyline_top2
  - pop909_dataset

# All scripts available for benchmarking
scripts_all:
  - fake_offline_script
  - template_benchmark_script

# Scripts to be included in the next benchmark run
scripts_to_run:
  - fake_offline_script